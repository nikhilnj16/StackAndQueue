# Staged by RepoRanger. Move this file to: .github/workflows/ai-worker.yml
# See the instructions in the open pull request.
# This workflow runs the AI code review on every pull request.

name: RepoRanger AI Code Review

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4

      - name: Checkout RepoRanger bot repository
        uses: actions/checkout@v4
        with:
          repository: nikhilnj16/git_extension
          path: _reporanger

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bot dependencies
        run: pip install PyGithub requests python-dotenv

      - name: Run AI Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: >-
            ${{ github.event_name == 'workflow_dispatch'
              && github.event.inputs.pr_number
              || github.event.pull_request.number }}
          SLM_API_KEY: ${{ secrets.SLM_API_KEY }}
        run: python _reporanger/bot_logic/ai_reviewer.py
